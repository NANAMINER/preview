name: Bootstrap Current Duck Farm Site

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v6

      - name: Download current Duck Farm mock artifact
        run: |
          curl -fL 'https://sdmntpreastus.oaiusercontent.com/files/00000000-2ad8-81f9-82ce-4bb7019335ba/raw?se=2026-09-10T18%3A20%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=045f22e8-e209-5807-b2fd-e5f3e4cbe52c&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T06%3A33%3A26Z&ske=2026-09-11T06%3A33%3A26Z&sks=b&skv=2026-02-06&sig=BwXY9UYVKqXMI2UrTtg8/xtbwp4eatp%2BCAP0z57PYLs%3D' -o current-preview.zip
          rm -rf _bootstrap_site
          mkdir _bootstrap_site
          unzip -q current-preview.zip -d _bootstrap_site
          tar -C _bootstrap_site -czf site.tar.gz .

      - name: Commit packaged site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site.tar.gz
          if git diff --cached --quiet; then
            echo 'Current site package is already up to date.'
            exit 0
          fi
          git commit -m 'preview: bootstrap current Duck Farm build'
          git push
